# CI: test, build, and optionally build Docker images for service and worker.
# Docker jobs run only when code that affects each image changes (path filters).
# See docs/ci-cd.md for the strategy.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect which parts of the repo changed (for conditional Docker builds).
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/backup-common/**'
              - 'crates/backup-service/**'
              - 'Dockerfile.service'
              - 'docker-compose.yml'
              - 'proto/**'
              - 'migrations/**'
            worker:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/backup-common/**'
              - 'crates/backup-worker/**'
              - 'Dockerfile.worker'
              - 'docker-compose.yml'
              - 'proto/**'

  # Run tests and clippy on every push/PR.
  test:
    name: Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

  # Release build for both binaries when Rust code changes.
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload backup-service binary
        uses: actions/upload-artifact@4
        with:
          name: backup-service
          path: target/release/backup-service

      - name: Upload backup-worker binary
        uses: actions/upload-artifact@4
        with:
          name: backup-worker
          path: target/release/backup-worker

  # Build API Docker image only when service-related code or Dockerfile.service changes.
  docker-service:
    name: Docker image (service)
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.service == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@3

      - name: Build backup-service image
        uses: docker/build-push-action@6
        with:
          context: .
          file: Dockerfile.service
          push: false
          load: true
          tags: backup-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build worker Docker image only when worker-related code or Dockerfile.worker changes.
  docker-worker:
    name: Docker image (worker)
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.worker == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@3

      - name: Build backup-worker image
        uses: docker/build-push-action@6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: backup-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
