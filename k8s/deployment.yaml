apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-service
  namespace: backup-service
  labels:
    app: backup-service
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backup-service
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backup-service
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: backup-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: backup-service
          image: backup-service:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backup-service-config
            - secretRef:
                name: backup-service-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
---
# Worker deployment — separate binary consuming from RabbitMQ,
# reporting results to backup-service via gRPC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-worker
  namespace: backup-service
  labels:
    app: backup-service
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backup-service
      component: worker
  template:
    metadata:
      labels:
        app: backup-service
        component: worker
    spec:
      serviceAccountName: backup-service
      terminationGracePeriodSeconds: 60
      containers:
        - name: backup-worker
          image: backup-service:latest
          command: ["backup-worker"]
          envFrom:
            - configMapRef:
                name: backup-worker-config
            - secretRef:
                name: backup-service-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["true"]
            periodSeconds: 30
