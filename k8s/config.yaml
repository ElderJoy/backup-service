apiVersion: v1
kind: Namespace
metadata:
  name: backup-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-service
  namespace: backup-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-service-config
  namespace: backup-service
data:
  LISTEN_ADDR: "0.0.0.0:8080"
  GRPC_LISTEN_ADDR: "0.0.0.0:50051"
  RUST_LOG: "backup_service=info,tower_http=info,sqlx=warn"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability:4317"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECS: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-worker-config
  namespace: backup-service
data:
  GRPC_TARGET: "http://backup-service:50051"
  RUST_LOG: "backup_worker=info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-service-secrets
  namespace: backup-service
type: Opaque
stringData:
  DATABASE_URL: "postgres://backup:CHANGE_ME@postgres:5432/backup_service"
  REDIS_URL: "redis://redis:6379"
  AMQP_URL: "amqp://backup:CHANGE_ME@rabbitmq:5672/%2f"
  JWT_SECRET: "CHANGE_ME_TO_A_RANDOM_256_BIT_KEY"
---
# Worker gets only AMQP (least privilege — no DB/Redis/JWT)
apiVersion: v1
kind: Secret
metadata:
  name: backup-worker-secrets
  namespace: backup-service
type: Opaque
stringData:
  AMQP_URL: "amqp://backup:CHANGE_ME@rabbitmq:5672/%2f"
