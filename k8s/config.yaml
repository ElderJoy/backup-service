apiVersion: v1
kind: Namespace
metadata:
  name: acronis
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-service
  namespace: acronis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-service-config
  namespace: acronis
data:
  LISTEN_ADDR: "0.0.0.0:8080"
  RUST_LOG: "backup_service=info,tower_http=info,sqlx=warn"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability:4317"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECS: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-service-secrets
  namespace: acronis
type: Opaque
stringData:
  DATABASE_URL: "postgres://backup:CHANGE_ME@postgres.acronis:5432/backup_service"
  REDIS_URL: "redis://redis.acronis:6379"
  AMQP_URL: "amqp://backup:CHANGE_ME@rabbitmq.acronis:5672/%2f"
  JWT_SECRET: "CHANGE_ME_TO_A_RANDOM_256_BIT_KEY"
